name: Public plugin quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Manifest and release packaging
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Enforce exact public release boundary and package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          root=pathlib.Path('.')
          allowed={
            '.agents/plugins/marketplace.json',
            '.claude-plugin/marketplace.json','.claude-plugin/plugin.json',
            '.cursor/mcp.json','.mcp.json','.gitignore',
            'README.md','LICENSE','SECURITY.md','plugin.json','mcp.json','server.json',
            '.github/workflows/plugin-quality.yml',
            '.github/workflows/release-integrity.yml',
            '.github/workflows/mcp-registry-publish.yml',
            'assets/docsy-icon-192.png','assets/docsy-logo-512.png',
            'assets/docsy-marketplace-400.png',
            'assets/docsy-logo-dark-512.png','assets/docsy-wordmark-inverse.svg',
            'assets/docsy-wordmark.svg','assets/github-social-preview-1280x640.png',
            'docs/GETTING-STARTED.md','docs/CLIENT-INTEGRATIONS.md',
            'docs/BRAND-ASSETS.md','docs/DISTRIBUTION-STATUS.md',
            'skills/find-docs/SKILL.md',
          }
          actual={p.as_posix() for p in root.rglob('*')
                  if p.is_file() and '.git' not in p.parts}
          assert actual==allowed, 'Unapproved public paths: '+str(sorted(actual^allowed))
          plugin=json.loads(pathlib.Path('plugin.json').read_text())
          mcp=json.loads(pathlib.Path('mcp.json').read_text())
          server=json.loads(pathlib.Path('server.json').read_text())
          assert plugin['name']=='docsy'
          assert re.fullmatch(r'\d+\.\d+\.\d+',plugin['version'])
          assert mcp['mcpServers']['docsy']['url']=='https://docsy.remcp.site/mcp'
          assert server['name']=='io.github.getremcp/docsy'
          assert server['remotes'][0]['url']=='https://docsy.remcp.site/mcp/registry'
          assert not any(p.is_symlink() for p in root.rglob('*') if '.git' not in p.parts)
          names=['plugin.json','mcp.json','skills/find-docs/SKILL.md',
                 'assets/docsy-icon-192.png','assets/docsy-logo-512.png',
                 'assets/docsy-logo-dark-512.png']
          dest=pathlib.Path('/tmp/docsy-plugin-check.zip')
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
            for name in sorted(names):
              info=zipfile.ZipInfo(name,(2026,10,11,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=0o644<<16
              archive.writestr(info,pathlib.Path(name).read_bytes(),
                               compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          assert zipfile.ZipFile(dest).namelist()==sorted(names)
          print('PASS strict allowlist',len(actual),'paths; version',plugin['version'])
          print('Build checksum:',hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
