name: Publish Docsy MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: docsy-official-mcp-registry
  cancel-in-progress: false
jobs:
  publish:
    name: Validate and publish remote MCP server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require stable release with byte-identical server manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          tag="plugin-v${version}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
            --jq 'if (.isDraft or .isPrerelease or .tagName == null) then error("Only stable release allowed") else .tagName end'
          git show "${tag}:server.json" | cmp - server.json
          python3 - <<'PY'
          import json
          m=json.load(open('server.json'))
          assert m['name']=='io.github.getremcp/docsy'
          assert m['remotes']==[{'type':'streamable-http','url':'https://docsy.remcp.site/mcp/registry'}]
          print('Stable manifest verified')
          PY
      - name: Install pinned publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "${RUNNER_TEMP}/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${RUNNER_TEMP}/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/mcp-publisher.tar.gz" -C "${RUNNER_TEMP}" mcp-publisher
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Validate manifest and publish with GitHub OIDC
        run: |
          mcp-publisher validate server.json
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
